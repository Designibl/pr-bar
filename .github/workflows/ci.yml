name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax check
        run: |
          python3 -m py_compile bin/prbar_common.py bin/prbar-fetch bin/prbar-ctl plugin/prbar.1m.py
          bash -n install.sh uninstall.sh scripts/setup-repo.sh
